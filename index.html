<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity Projects</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: linear-gradient(145deg, #040407 0%, #0d0611 60%, #1a081c 100%);
      --surface: #0b0712;
      --surface-hover: rgba(28, 20, 38, 0.65);
      --border: rgba(255, 255, 255, 0.05);
      --border-focus: rgba(255, 46, 146, 0.35);

      --pink: #ff2e92;
      --purple: #9d33ff;
      --cyan: #00f0ff;

      --text-main: #f4f4f6;
      --text-muted: #9c9cb0;
      --text-faint: #56566b;

      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --max-width: 1200px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      background-color: #040407;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center;
      animation: backgroundDataDrift 40s linear infinite;
    }

    @keyframes backgroundDataDrift {
      from { background-position: 0 0; }
      to   { background-position: 40px 80px; }
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #040407; }
    ::-webkit-scrollbar-thumb { background: #191424; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #2b1f3a; }

    .portfolio-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 2rem;
    }

    .page-header {
      padding: 5rem 0 3rem;
      border-bottom: 1px solid var(--border);
    }

    .page-heading {
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      text-shadow:
        0 0 8px var(--cyan),
        0 0 20px rgba(0, 240, 255, 0.1);
      margin-bottom: 0.75rem;
    }

    .page-intro {
      color: var(--text-muted);
      font-size: 1.05rem;
      max-width: 60ch;
    }

    .projects-section {
      padding: 3rem 0 6rem;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2rem;
    }

    .project-card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid transparent;
      border-radius: 12px;
      overflow: hidden;
      z-index: 1;
      transition: box-shadow 0.4s ease, transform 0.3s ease-out;
    }

    .project-card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg,
          transparent 20%,
          var(--pink) 40%,
          var(--cyan) 60%,
          transparent 80%);
      animation: neonBorderRotate 6s linear infinite;
      opacity: 0.18;
      z-index: -2;
      transition: opacity 0.4s ease;
    }

    .project-card::after {
      content: "";
      position: absolute;
      inset: 1.5px;
      background: var(--surface);
      border-radius: 10.5px;
      z-index: -1;
    }

    .project-card:hover,
    .project-card:focus-within {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(0, 240, 255, 0.12), 0 0 15px rgba(255, 46, 146, 0.05);
    }

    .project-card:hover::before,
    .project-card:focus-within::before {
      opacity: 1;
      animation-duration: 3s;
    }

    @keyframes neonBorderRotate {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .project-preview {
      position: relative;
      width: calc(100% - 3px);
      margin: 1.5px 1.5px 0;
      aspect-ratio: 16 / 9;
      background: rgba(4, 4, 7, 0.5);
      border-bottom: 1px solid var(--border);
      border-radius: 10.5px 10.5px 0 0;
      overflow: hidden;
    }

    .project-preview iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
      border: 0;
      background: #ffffff;
      transform-origin: top left;
      pointer-events: none;
    }

    .project-details {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 0.75rem;
      padding: 1.5rem 1.5rem 1.75rem;
    }

    .project-title {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .project-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .project-btn {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 0.5rem;
      margin-top: auto;
      padding: 0.65rem 1.25rem;
      background: rgba(255, 46, 146, 0.1);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 46, 146, 0.3);
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .project-text + .project-btn {
      margin-top: 0.75rem;
    }

    .project-btn:hover,
    .project-btn:focus-visible {
      background: var(--pink);
      color: #040407;
      border-color: var(--pink);
      box-shadow: 0 0 15px rgba(255, 46, 146, 0.4);
      transform: translateY(-2px);
    }

    .project-btn:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    .project-card:nth-child(even) .project-btn {
      background: rgba(0, 240, 255, 0.05);
      border-color: rgba(0, 240, 255, 0.25);
    }

    .project-card:nth-child(even) .project-btn:hover,
    .project-card:nth-child(even) .project-btn:focus-visible {
      background: var(--cyan);
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    @media (max-width: 768px) {
      .portfolio-container { padding: 0 1.25rem; }
      .page-header { padding: 3rem 0 2rem; }
      .projects-grid { grid-template-columns: 1fr; gap: 1.5rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      body,
      .project-card::before {
        animation: none;
      }
      .project-card,
      .project-btn {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <header class="page-header">
    <div class="portfolio-container">
      <h1 class="page-heading">Web DevelopmentActivity Projects</h1>
    </div>
  </header>

  <main class="projects-section">
    <div class="portfolio-container">
      <div class="projects-grid">

        <article class="project-card">
          <div class="project-preview">
            <iframe
              src="activity_1/bento_activity.html"
              title="Preview of Activity 1: Bento Layout Activity"
              loading="lazy"
              tabindex="-1"></iframe>
          </div>
          <div class="project-details">
            <h2 class="project-title">Activity 1: Bento Layout Activity</h2>
            <p class="project-text">A bento-style layout built with CSS Grid. Tiles of different sizes fit together in one tidy, responsive grid.</p>
            <a class="project-btn" href="activity_1/bento_activity.html">Open project</a>
          </div>
        </article>

        <!--
          To add the next project, copy the whole <article> above and change:
            - the iframe src and title
            - the heading (Activity 2: Name)
            - the description
            - the button href
        -->

      </div>
    </div>
  </main>

  <script>
    // Scale each 1280x720 iframe so the full page fits inside its card preview.
    (function () {
      var DESIGN_WIDTH = 1280;
      var previews = document.querySelectorAll('.project-preview');

      function fit(preview) {
        var frame = preview.querySelector('iframe');
        if (frame) {
          frame.style.transform = 'scale(' + (preview.clientWidth / DESIGN_WIDTH) + ')';
        }
      }

      previews.forEach(function (preview) {
        fit(preview);
        if ('ResizeObserver' in window) {
          new ResizeObserver(function () { fit(preview); }).observe(preview);
        }
      });
      window.addEventListener('resize', function () { previews.forEach(fit); });
    })();
  </script>
</body>
</html>
